applications:
    - app: blinky
      boards:
        - board: nrf5340dk/nrf5340/cpuapp
        - board: qemu_x86
        # - board: native_sim
      configs:
        - gpio
        - log+debug+gpio
      configs_dir: ../deps/zpp_lib/configs

    - app: bme280
      boards:
        - board: nrf5340dk/nrf5340/cpuapp
        - board: qemu_x86
        # - board: native_sim
      configs: 
        - sensor
        - log+debug+sensor
      configs_dir: ../deps/zpp_lib/configs
    
    - app: bike_computer
      boards:
        - board: nrf5340dk/nrf5340/cpuapp
          shield: adafruit_2_8_tft_touch_v2
        - board: qemu_x86
      configs:
        - gpio+display+sensor+phase_a
        - log+debug+gpio+display+sensor+phase_a
      configs_dir: ../deps/zpp_lib/configs