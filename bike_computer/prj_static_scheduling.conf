# enable static scheduling
CONFIG_BIKE_COMPUTER_STATIC_SCHEDULING=y

# increase the stack size of the threads created with zpp_lib
CONFIG_ZPP_THREAD_STACK_SIZE=4096

# increase the stack size of the main thread
CONFIG_MAIN_STACK_SIZE=4096

# enable logging of task times in TaskManager class
CONFIG_LOG_TASK_TIMES=n

# enable logging level debug
CONFIG_APP_LOG_LEVEL_DEBUG=y